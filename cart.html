<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox Cart</title>
    <script src="https://kit.fontawesome.com/b94589ba67.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./images/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Londrina+Shadow&family=Moo+Lah+Lah&display=swap" rel="stylesheet">
</head>
<body>
    <header>
    <nav>
            <div>
                <img src="./images/logo.png" alt="logo">
                <ul>
                    <li><a href="home.html" class="active" target="_blank">Home</a></li>
                    <li><a href="menu.html" target="_blank">Menu</a></li>
                    <li><a href="biteDeals.html" target="_blank">Bite Deal</a></li>
                    <li><a href="cart.html" target="_blank"><i class="fa-solid fa-cart-arrow-down" ></i></a></li>
                    <li><a href="login.html" target="_blank"><i class="fa-solid fa-right-to-bracket"></i>Login</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- cart table starts -->
     <table>
        <thead>
            <tr>
                <th class="radius">Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th class="right">Remove</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="item">
                    <img src="./images/Burger.jpg" alt="Burger">
                    <div class="cart-img">
                        <h4>Chesse Burger</h4>
                        <p>Juicey grilled burger</p>
                    </div>
                </td>
                <td>₹199</td>
                <td>
                    <div class="button">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                    </div>
                </td>
                <td>₹199</td>
                <td><button class="remove">X</button></td>
            </tr>
            <tr>
                <td class="item">
                    <img src="./images/Menu Pizza.png" alt="Pizza">
                    <div class="cart-img">
                        <h4>Capsicum Pizza</h4>
                        <p>Loaded with chesse</p>
                    </div>
                </td>
                <td>₹249</td>
                <td>
                    <div class="button">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                    </div>
                </td>
                <td>₹249</td>
                <td><button class="remove">X</button></td>
            </tr>
            <tr>
                <td class="item">
                    <img src="./images/Menu Pasta.png" alt="Pasta">
                    <div class="cart-img">
                        <h4>Alfredo Pasta</h4>
                        <p>Creamy white sauce</p>
                    </div>
                </td>
                <td>₹229</td>
                <td>
                    <div class="button">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                    </div>  
                </td>
                <td>₹229</td>
                <td><button class="remove">X</button></td>
            </tr>
            <tr class="total">
                <th colspan="3">Grand Total</th>
                <th>₹797</th>
                <td><button>Proceed</button></td>
            </tr>
        </tbody>
     </table>
</body>
</html>
